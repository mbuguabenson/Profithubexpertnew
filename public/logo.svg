<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none">
  <defs>
    <!-- Background Gradient for Hexagon -->
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glowing Vector Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00F2FE" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- ICON BADGE (x: 10, y: 10, w: 100, h: 100) -->
  <g transform="translate(10, 10)" filter="url(#subtleShadow)">
    <!-- Hexagon Outer Border / Ring -->
    <polygon points="50,4 92,27 92,73 50,96 8,73 8,27" fill="url(#hexGrad)" stroke="url(#neonCyan)" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Inner Accent Nodes -->
    <circle cx="50" cy="4" r="3" fill="#00F2FE" />
    <circle cx="92" cy="27" r="3" fill="#4FACFE" />
    <circle cx="92" cy="73" r="3" fill="#10B981" />
    <circle cx="50" cy="96" r="3" fill="#00F2FE" />
    <circle cx="8" cy="73" r="3" fill="#8B5CF6" />
    <circle cx="8" cy="27" r="3" fill="#3B82F6" />

    <!-- Interlocking "P" & "H" Futuristic Monogram -->
    <!-- P Stem & Loop -->
    <path d="M30 26 V74 M30 26 H48 C57 26 62 31 62 39 C62 47 57 52 48 52 H30" 
          stroke="url(#neonCyan)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />

    <!-- H Bar & Right Stem Merging with Rising Profit Arrow -->
    <path d="M48 52 H64 M64 36 V74" 
          stroke="url(#neonEmerald)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Upward Rising Breakout Arrow Head -->
    <polygon points="64,22 74,34 54,34" fill="url(#neonEmerald)" filter="url(#neonGlow)" />

    <!-- Center Pulse Node -->
    <circle cx="48" cy="52" r="3.5" fill="#FFFFFF" />
  </g>

  <!-- TYPOGRAPHY / WORDMARK (x: 125) -->
  <!-- "PROFIT" -->
  <text x="125" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', 'Inter', sans-serif" font-size="44" font-weight="900" letter-spacing="1.5" fill="url(#textGrad)">
    PROFIT<tspan fill="url(#hubGrad)">HUB</tspan>
  </text>

  <!-- Tagline / Badge -->
  <g transform="translate(126, 82)">
    <rect x="0" y="0" width="80" height="18" rx="4" fill="rgba(0, 242, 254, 0.12)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1" />
    <text x="7" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" letter-spacing="1" fill="#00F2FE">
      EXPERT AI
    </text>
    <text x="92" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" letter-spacing="2" fill="#94A3B8">
      ALGO TRADING ECOSYSTEM
    </text>
  </g>
</svg>
