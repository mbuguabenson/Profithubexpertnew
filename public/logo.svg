<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" fill="none">
  <defs>
    <!-- Import Cinzel/Playfair-like styling fallback -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&amp;family=Outfit:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap');
      .logo-legacy {
        font-family: 'Cinzel', 'Playfair Display', 'Times New Roman', serif;
        font-weight: 800;
        letter-spacing: 2.5px;
        fill: #033d26;
      }
      .logo-hub {
        font-family: 'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif;
        font-weight: 700;
        letter-spacing: 7px;
        fill: #8dc63f;
      }
      .logo-tagline {
        font-family: 'Cinzel', 'Times New Roman', serif;
        font-weight: 700;
        letter-spacing: 1.8px;
        font-size: 11px;
        fill: #033d26;
      }
    </style>
  </defs>

  <!-- ─── Icon / Emblem Group ─── -->
  <g transform="translate(5, 0) scale(0.95)">
    <!-- Lime Green Background Bars -->
    <rect x="52" y="52" width="12" height="66" rx="1.5" fill="#8dc63f" />
    <rect x="70" y="38" width="13" height="80" rx="1.5" fill="#8dc63f" />
    <rect x="90" y="55" width="12" height="63" rx="1.5" fill="#8dc63f" />
    <rect x="108" y="65" width="12" height="53" rx="1.5" fill="#8dc63f" />
    <rect x="126" y="58" width="12" height="60" rx="1.5" fill="#8dc63f" />
    <rect x="144" y="50" width="12" height="68" rx="1.5" fill="#8dc63f" />

    <!-- Dark Green Left & Bottom Frame -->
    <path d="M33 55 H46 V106 H33 Z" fill="#033d26" />
    <path d="M33 118 H156 V131 H33 Z" fill="#033d26" />

    <!-- Rising Dark Green Trendline Arrow -->
    <path d="M33 106 L75 54 L92 76 L136 32" stroke="#033d26" stroke-width="13" stroke-linecap="square" stroke-linejoin="miter" />
    <polygon points="124,18 160,25 146,58 139,40 120,40" fill="#033d26" />
  </g>

  <!-- ─── Typography Group ─── -->
  <g transform="translate(175, 10)">
    <!-- 1. LEGACY -->
    <text x="0" y="58" class="logo-legacy" font-size="52">LEGACY</text>

    <!-- 2. TRADING HUB -->
    <text x="3" y="88" class="logo-hub" font-size="23">TRADING HUB</text>

    <!-- 3. Tagline -->
    <text x="32" y="108" class="logo-tagline">WHERE STRATEGY MEETS PRECISION.</text>
  </g>
</svg>
