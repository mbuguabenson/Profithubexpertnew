<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" fill="none">
  <defs>
    <!-- 3D Glass Surface Gradient -->
    <linearGradient id="pubGlassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2" />
    </linearGradient>

    <!-- 3D Glass Rim Bevel Highlight -->
    <linearGradient id="pubGlassRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#34d399" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2" />
    </linearGradient>

    <!-- Diagonal Glass Reflection Sheen -->
    <linearGradient id="pubSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- 3D Bars Gradients -->
    <linearGradient id="pubBarFront1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="pubBarTop1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="pubBarSide1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <linearGradient id="pubBarFront2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="pubBarTop2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="pubBarSide2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <linearGradient id="pubBarFront3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="pubBarTop3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="pubBarSide3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>

    <!-- 3D Surging Arrow -->
    <linearGradient id="pubSurgeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="35%" stop-color="#10b981" />
      <stop offset="75%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Text Accent Gradient -->
    <linearGradient id="pubTextAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Filters -->
    <filter id="pub3dShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <filter id="pubGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.45" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&amp;display=swap');
      .modern-brand-legacy {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        letter-spacing: 2px;
        fill: #0f172a;
      }
      .modern-brand-hub {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        letter-spacing: 4px;
        fill: url(#pubTextAccent);
      }
      @media (prefers-color-scheme: dark) {
        .modern-brand-legacy {
          fill: #ffffff;
        }
      }
    </style>
  </defs>

  <!-- ─── 3D Glassmorphic Emblem ─── -->
  <g transform="translate(8, 8)" filter="url(#pub3dShadow)">
    <rect x="0" y="0" width="104" height="104" rx="26" fill="url(#pubGlassBg)" stroke="url(#pubGlassRim)" stroke-width="1.8" />
    <path d="M4 38 L38 4 C54 4 74 12 90 28 L28 90 C12 74 4 54 4 38 Z" fill="url(#pubSheen)" opacity="0.7" />
    <path d="M16 8 C34 2 70 2 88 8" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8" fill="none" />

    <!-- Bar 1 -->
    <g filter="url(#pubGlow)">
      <rect x="18" y="54" width="15" height="34" rx="3" fill="url(#pubBarFront1)" />
      <polygon points="18,54 25,47 40,47 33,54" fill="url(#pubBarTop1)" />
      <polygon points="33,54 40,47 40,81 33,88" fill="url(#pubBarSide1)" opacity="0.9" />
    </g>

    <!-- Bar 2 -->
    <g filter="url(#pubGlow)">
      <rect x="41" y="36" width="15" height="52" rx="3" fill="url(#pubBarFront2)" />
      <polygon points="41,36 48,29 63,29 56,36" fill="url(#pubBarTop2)" />
      <polygon points="56,36 63,29 63,81 56,88" fill="url(#pubBarSide2)" opacity="0.9" />
    </g>

    <!-- Bar 3 -->
    <g filter="url(#pubGlow)">
      <rect x="64" y="20" width="15" height="68" rx="3" fill="url(#pubBarFront3)" />
      <polygon points="64,20 71,13 86,13 79,20" fill="url(#pubBarTop3)" />
      <polygon points="79,20 86,13 86,81 79,88" fill="url(#pubBarSide3)" opacity="0.9" />
    </g>

    <!-- Surging Growth Vector -->
    <path d="M12 80 L38 48 L56 60 L86 20" stroke="rgba(0,0,0,0.3)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M12 79 L38 47 L56 59 L86 19" stroke="#047857" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M12 77 L38 45 L56 57 L86 17" stroke="url(#pubSurgeGrad)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <polygon points="72,10 94,12 88,34 83,24 75,26" fill="url(#pubSurgeGrad)" filter="url(#pubGlow)" />
    <circle cx="92" cy="13" r="3" fill="#ffffff" />
    <line x1="92" y1="5" x2="92" y2="21" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    <line x1="84" y1="13" x2="100" y2="13" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- ─── Modernized Typography (No Slogan) ─── -->
  <g transform="translate(132, 16)">
    <text x="0" y="52" class="modern-brand-legacy" font-size="46">LEGACY</text>
    <text x="2" y="82" class="modern-brand-hub" font-size="20">TRADING HUB</text>
  </g>
</svg>
