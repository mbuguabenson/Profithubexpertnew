<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Background Radial / Linear Gloss -->
    <linearGradient id="phBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="50%" stop-color="#141f36" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>

    <!-- Multi-Stage Cyber Luminescence Gradients -->
    <linearGradient id="phNeonPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="phNeonGoldGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5c542" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="phGleamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="phGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="phShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#7c3aed" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#phShadow)">
    <!-- Rounded Modern Hexagonal Shield Outer -->
    <path d="M60 6 
             L106 32.5 
             Q110 35 110 40 
             L110 80 
             Q110 85 106 87.5 
             L60 114 
             Q56 116 52 114 
             L14 87.5 
             Q10 85 10 80 
             L10 40 
             Q10 35 14 32.5 
             L52 6 
             Q56 4 60 6 Z" 
          fill="url(#phBadgeGrad)" 
          stroke="url(#phNeonPrimary)" 
          stroke-width="2.5" />

    <!-- Subtle Inner Gloss Rim -->
    <path d="M56 10 L102 36 L102 78 L56 108 L18 82 L18 36 Z" 
          fill="none" 
          stroke="rgba(255, 255, 255, 0.08)" 
          stroke-width="1" />

    <!-- Corner Constellation Tech Nodes -->
    <circle cx="60" cy="6" r="3.5" fill="#00f2fe" filter="url(#phGlow)" />
    <circle cx="108" cy="34" r="3" fill="#7c3aed" />
    <circle cx="108" cy="84" r="3.5" fill="#10b981" filter="url(#phGlow)" />
    <circle cx="56" cy="114" r="3" fill="#f5c542" />
    <circle cx="12" cy="84" r="3" fill="#3b82f6" />
    <circle cx="12" cy="34" r="3" fill="#00f2fe" />

    <!-- Algorithmic Monogram: Interlocking 'P' and Ascending 'H' Growth Wave -->
    <!-- 'P' Pillar & Loop -->
    <path d="M36 32 V88 M36 32 H58 C68 32 74 38 74 47 C74 56 68 62 58 62 H36" 
          stroke="url(#phNeonPrimary)" 
          stroke-width="6.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#phGlow)" />

    <!-- Ascending Quantum Trend Line forming 'H' & Breakout -->
    <path d="M58 62 H76 M76 46 V88" 
          stroke="url(#phNeonGoldGreen)" 
          stroke-width="6.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#phGlow)" />

    <!-- Laser Growth Arrow Head -->
    <path d="M76 26 L90 42 H62 Z" 
          fill="url(#phNeonGoldGreen)" 
          filter="url(#phGlow)" />

    <!-- Core Quantum Data Flare Core -->
    <circle cx="58" cy="62" r="4.5" fill="#ffffff" filter="url(#phGlow)" />
    <circle cx="76" cy="46" r="3.5" fill="#ffffff" />
  </g>
</svg>
