<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Gradient for Hexagon -->
    <linearGradient id="hexGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glowing Vector Gradients -->
    <linearGradient id="neonCyanIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    
    <linearGradient id="neonEmeraldIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlowIcon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleShadowIcon" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#00F2FE" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#subtleShadowIcon)">
    <!-- Hexagon Outer Border -->
    <polygon points="50,4 92,27 92,73 50,96 8,73 8,27" fill="url(#hexGradIcon)" stroke="url(#neonCyanIcon)" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Nodes -->
    <circle cx="50" cy="4" r="3" fill="#00F2FE" />
    <circle cx="92" cy="27" r="3" fill="#4FACFE" />
    <circle cx="92" cy="73" r="3" fill="#10B981" />
    <circle cx="50" cy="96" r="3" fill="#00F2FE" />
    <circle cx="8" cy="73" r="3" fill="#8B5CF6" />
    <circle cx="8" cy="27" r="3" fill="#3B82F6" />

    <!-- Interlocking "P" & "H" Monogram -->
    <!-- P Stem & Loop -->
    <path d="M30 26 V74 M30 26 H48 C57 26 62 31 62 39 C62 47 57 52 48 52 H30" 
          stroke="url(#neonCyanIcon)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlowIcon)" />

    <!-- H Bar & Right Stem Merging with Rising Profit Arrow -->
    <path d="M48 52 H64 M64 36 V74" 
          stroke="url(#neonEmeraldIcon)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Upward Rising Breakout Arrow Head -->
    <polygon points="64,20 75,33 53,33" fill="url(#neonEmeraldIcon)" filter="url(#neonGlowIcon)" />

    <!-- Center Pulse Node -->
    <circle cx="48" cy="52" r="3.5" fill="#FFFFFF" />
  </g>
</svg>
