<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <defs>
    <!-- Filter for subtle crispness -->
    <filter id="logoGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <g filter="url(#logoGlow)">
    <!-- ─── 1. Lime Green Background Chart Bars ─── -->
    <!-- Bar 1 -->
    <rect x="52" y="52" width="12" height="66" rx="1.5" fill="#8dc63f" />
    <!-- Bar 2 (Tallest) -->
    <rect x="70" y="38" width="13" height="80" rx="1.5" fill="#8dc63f" />
    <!-- Bar 3 -->
    <rect x="90" y="55" width="12" height="63" rx="1.5" fill="#8dc63f" />
    <!-- Bar 4 -->
    <rect x="108" y="65" width="12" height="53" rx="1.5" fill="#8dc63f" />
    <!-- Bar 5 -->
    <rect x="126" y="58" width="12" height="60" rx="1.5" fill="#8dc63f" />
    <!-- Bar 6 -->
    <rect x="144" y="50" width="12" height="68" rx="1.5" fill="#8dc63f" />

    <!-- ─── 2. Dark Forest Green 'L' Frame & Base ─── -->
    <!-- Vertical Left Bar of L -->
    <path d="M33 55 H46 V106 H33 Z" fill="#033d26" />
    <!-- Horizontal Base Bar of L -->
    <path d="M33 118 H156 V131 H33 Z" fill="#033d26" />

    <!-- ─── 3. Dynamic Rising Trendline & Arrow ─── -->
    <!-- Main Thick Polyline Arrow Body -->
    <path d="M33 106 
             L75 54 
             L92 76 
             L136 32" 
          stroke="#033d26" 
          stroke-width="13" 
          stroke-linecap="square" 
          stroke-linejoin="miter" />

    <!-- Arrow Head at top right -->
    <polygon points="124,18 160,25 146,58 139,40 120,40" fill="#033d26" />
  </g>
</svg>
